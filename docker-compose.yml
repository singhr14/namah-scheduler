version: '3.8'

services:
  storysync:
    build: .
    container_name: storysync
    env_file: .env
    network_mode: bridge
    extra_hosts:
      - "search-dev.aumnamah.com:80.225.196.246"
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "storysync.main", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Optional: Add monitoring with Prometheus
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'

networks:
  default:
    name: storysync-network
